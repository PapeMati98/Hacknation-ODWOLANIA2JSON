# Klasa dokumentu: odwołanie do Prezesa Krajowej Izby Odwoławczej.
# Każde pole liścia: type (string|integer|number), validator (validators.VALIDATORS),
# desc (instrukcja dla modelu), opcjonalnie enum, derive, verify_in_text.
name: odwolanie
description: >-
  Odwołanie wnoszone do Prezesa Krajowej Izby Odwoławczej przez wykonawcę (Odwołującego)
  wobec czynności lub zaniechania Zamawiającego w postępowaniu o udzielenie zamówienia publicznego.
pages: 3            # ile pierwszych stron czytać (kluczowe dane są zwykle na 1-3 stronie)
classify:
  title: ["odwołanie"]
  keywords:
    "odwołanie": 2
    "krajowej izby odwoławczej": 3
    "odwołujący": 3
    "wnoszę odwołanie": 4
    "zarzut": 1
    "zamawiający": 1
  negative:
    "pełnomocnictwo": 1
    "potwierdzenie przelewu": 3
dictionaries:
  powody:
    1: Decyzja o odrzuceniu oferty
    2: Ogłoszenie wyboru oferty
    3: Decyzja o wykluczeniu wykonawcy
    4: Publikacja specyfikacji warunków zamówienia (SWZ)
    5: Modyfikacja treści SWZ
    6: Odpowiedzi i wyjaśnienia do SWZ
    7: Zaniechanie odrzucenia oferty
    8: Zaniechanie wykluczenia wykonawcy
    9: Decyzja o unieważnieniu postępowania
    10: Zaniechanie unieważnienia postępowania
    11: Opis przedmiotu zamówienia (OPZ)
hints:        # podpowiedzi dla modelu: jak czynność bywa opisana w odwołaniu
  powody:
    1: Zamawiający odrzucił ofertę Odwołującego lub poinformował o jej odrzuceniu
    2: Zamawiający wybrał ofertę najkorzystniejszą innego wykonawcy lub ogłosił wybór
    3: Zamawiający wykluczył Odwołującego z postępowania
    4: Zamawiający opublikował ogłoszenie i SWZ; odwołanie dotyczy treści SWZ
    5: Zamawiający zmienił (zmodyfikował) treść SWZ
    6: Zamawiający udzielił odpowiedzi na pytania lub wyjaśnień treści SWZ
    7: Zamawiający nie odrzucił oferty innego wykonawcy, choć powinien
    8: Zamawiający nie wykluczył innego wykonawcy, choć powinien
    9: Zamawiający unieważnił postępowanie
    10: Zamawiający nie unieważnił postępowania, choć powinien
    11: Zamawiający udostępnił opis przedmiotu zamówienia; odwołanie dotyczy treści OPZ
output:
  OdwolanieKIO:
    data:
      type: string
      validator: date
      desc: "Data sporządzenia odwołania z nagłówka pierwszej strony (linia typu '<miejscowość>, dnia <dzień> <miesiąc> <rok> r.'). Przepisz datę tak, jak jest zapisana. Brak daty w nagłówku = '-'."
    czynnosc_dzien:
      type: string
      validator: date
      desc: "Dzień, w którym Zamawiający dokonał zaskarżonej czynności (albo jej zaniechał) - zwykle w zdaniu 'Zamawiający w dniu ... <co zrobił lub czego nie zrobił>' przed zarzutami lub w pierwszym zarzucie. Przepisz datę tak, jak jest zapisana. To nie jest data ustawy ani data odwołania."
    czynnosc_powod_id:
      type: integer
      enum_from: powody
      desc: "Rodzaj zaskarżonej czynności lub zaniechania Zamawiającego, której dotyczy pierwszy zarzut (zdanie 'Zamawiający w dniu ...' i treść pierwszego zarzutu)."
    czynnosc_opis:
      derive: {dictionary: powody, key: OdwolanieKIO.czynnosc_powod_id}
    miejscowosc:
      type: string
      requires: data
      validator: text
      verify_in_text: true
      desc: "Miejscowość z nagłówka pierwszej strony, z linii typu 'X, dnia ...'. Brak = null."
  Odwolujacy:
    - krs:
        type: string
        validator: krs
        desc: "KRS Odwołującego (lub lidera konsorcjum), 10 cyfr."
      nazwa:
        type: string
        validator: text
        verify_in_text: true
        desc: "Pełna nazwa Odwołującego (wykonawcy wnoszącego odwołanie) razem z formą prawną; przy konsorcjum nazwa lidera."
      nip:
        type: string
        validator: nip
        desc: "NIP Odwołującego (lub lidera), 10 cyfr."
      regon:
        type: string
        validator: regon
        desc: "REGON Odwołującego (lub lidera), 9 lub 14 cyfr."
      przez-pelnomocnika:
        type: integer
        enum: [0, 1]
        desc: "1 jeśli Odwołujący działa przez pełnomocnika (radca prawny, adwokat, kancelaria), inaczej 0."
      pelnomocnik:
        imie_nazwisko:
          type: string
          validator: person
          verify_in_text: true
          desc: "Imię i nazwisko pełnomocnika Odwołującego."
        nazwa:
          type: string
          validator: text
          verify_in_text: true
          desc: "Nazwa kancelarii lub podmiotu zatrudniającego pełnomocnika."
        mail:
          type: string
          validator: email
          desc: "Adres e-mail pełnomocnika."
  Zamawiajacy:
    - krs:
        type: string
        validator: krs
        desc: "KRS Zamawiającego, tylko jeśli podany przy Zamawiającym."
      nazwa:
        type: string
        validator: text
        verify_in_text: true
        desc: "Pełna nazwa Zamawiającego razem z formą prawną."
      nip:
        type: string
        validator: nip
        desc: "NIP Zamawiającego, tylko jeśli podany przy Zamawiającym."
      regon:
        type: string
        validator: regon
        desc: "REGON Zamawiającego, tylko jeśli podany przy Zamawiającym."
      prowadzacy_postepowanie:
        type: integer
        enum: [0, 1]
        only_if_multiple: true      # przy jednym Zamawiającym pole zawsze null
        desc: "Tylko gdy Zamawiających jest kilku: 1 jeśli ten jest oznaczony jako prowadzący lub lider postępowania, inaczej 0."
  ZamowieniePubliczne:
    numer_bzp:
      type: string
      validator: bzp
      desc: "Numer ogłoszenia w Biuletynie Zamówień Publicznych (rok/BZP i 8 cyfr). Nie numer TED."
    numer_postepowania:
      type: string
      validator: text
      verify_in_text: true
      desc: "Numer referencyjny postępowania nadany przez Zamawiającego (znak sprawy, zwykle litery, kropki i cyfry)."
    numer_ted:
      type: string
      validator: ted
      desc: "Numer ogłoszenia w Dzienniku Urzędowym UE (TED) (numer-rok albo rok/S numer-numer)."
    tytul:
      type: string
      validator: text
      verify_in_text: true
      desc: "Tytuł (nazwa) zamówienia, zwykle w cudzysłowie po słowach 'pn.' lub 'przedmiotem jest'."
