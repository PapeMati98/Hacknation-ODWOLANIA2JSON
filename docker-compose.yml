# Odwołania2json:
#   CLI (wsadowo): docker compose run --rm odwolania2json
#   Web UI (upload PDF + podgląd JSON/trace/YAML): docker compose up --build web
#   Oba razem: docker compose up --build
services:
  odwolania2json:
    build: .
    image: odwolania2json:latest
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./trace:/app/trace
      - ./models:/app/models
    environment:
      # liczba wątków CPU (domyślnie połowa rdzeni, najwyżej 6)
      - O2J_THREADS
      # opcjonalnie model serwowany przez API zgodne z OpenAI zamiast lokalnego pliku GGUF
      - O2J_API_BASE
      - O2J_API_MODEL
      - O2J_API_KEY

  web:
    build: .
    image: odwolania2json:latest
    ports:
      - "8080:8080"
    command:
      - sh
      - -c
      - 'if [ -z "$$O2J_API_BASE" ]; then python tools/download_models.py; fi && python -m odwolania2json.web --host 0.0.0.0 --port 8080'
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./trace:/app/trace
      - ./models:/app/models
      - ./configs:/app/configs
    environment:
      - O2J_THREADS
      - O2J_API_BASE
      - O2J_API_MODEL
      - O2J_API_KEY
